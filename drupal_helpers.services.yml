services:
  drupal_helpers.term:
    class: Drupal\drupal_helpers\Helpers\Term
    arguments: ['@entity_type.manager', '@messenger']
  drupal_helpers.menu:
    class: Drupal\drupal_helpers\Helpers\Menu
    arguments: ['@entity_type.manager', '@messenger']
  drupal_helpers.field:
    class: Drupal\drupal_helpers\Helpers\Field
    arguments: ['@entity_type.manager', '@messenger', '@entity_field.deleted_fields_repository', '@?Drupal\Core\Field\FieldPurger']
  drupal_helpers.entity:
    class: Drupal\drupal_helpers\Helpers\Entity
    arguments: ['@entity_type.manager', '@messenger']
  drupal_helpers.config:
    class: Drupal\drupal_helpers\Helpers\Config
    arguments: ['@config.factory', '@config.storage', '@extension.list.module', '@messenger']
  drupal_helpers.user:
    class: Drupal\drupal_helpers\Helpers\User
    arguments: ['@entity_type.manager', '@messenger', '@password_generator']
  drupal_helpers.redirect:
    class: Drupal\drupal_helpers\Helpers\Redirect
    arguments: ['@entity_type.manager', '@messenger']
  drupal_helpers.alias:
    class: Drupal\drupal_helpers\Helpers\Alias
    arguments: ['@entity_type.manager', '@messenger']
  drupal_helpers.role:
    class: Drupal\drupal_helpers\Helpers\Role
    arguments: ['@entity_type.manager', '@messenger', '@?user.permissions']
  drupal_helpers.module:
    class: Drupal\drupal_helpers\Helpers\Module
    arguments: ['@module_installer', '@extension.list.module', '@config.factory', '@config.manager', '@config.storage', '@update.update_hook_registry', '@update.post_update_registry', '@router.builder', '@messenger']
